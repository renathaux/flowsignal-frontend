<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset FlowSignal Password</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020812;color:#eaf3ff;font-family:Inter,Arial,sans-serif}.wrap{width:min(430px,calc(100vw - 32px));padding:30px;border:1px solid #1c4f7f;border-radius:20px;background:linear-gradient(180deg,#081624 0%,#05101c 100%);box-shadow:0 24px 80px rgba(0,0,0,.45)}.brand{font-size:22px;font-weight:800}.brand span{margin-left:8px;padding:4px 8px;border:1px solid #1688ff;border-radius:999px;color:#79baff;font-size:10px;letter-spacing:.16em}h1{margin:28px 0 8px;font-size:30px}.copy{margin:0 0 24px;color:#93a9c1;line-height:1.5}.form{display:grid;gap:16px}.field{display:grid;gap:7px;color:#a9bbce;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.field input{width:100%;padding:13px 14px;border:1px solid #244866;border-radius:10px;background:#07111e;color:#eef6ff;outline:none;font:inherit}.field input:focus{border-color:#1688ff;box-shadow:0 0 0 3px rgba(22,136,255,.13)}.otp{text-align:center;font-size:28px!important;font-weight:800!important;letter-spacing:10px!important;padding-left:24px!important}.submit{margin-top:4px;padding:13px;border:0;border-radius:10px;background:#087df2;color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.link{width:100%;margin-top:14px;border:0;background:transparent;color:#69adff;cursor:pointer}.error{min-height:20px;margin:12px 0 0;color:#ff7474;font-size:12px}.success{min-height:20px;margin:12px 0 0;color:#64d98b;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:24px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">FlowSignal <span>USER</span></div>

    <section id="emailStep">
      <h1>Forgot password?</h1>
      <p class="copy">Enter your account email. We’ll send you a 6-digit reset code.</p>
      <form id="emailForm" class="form">
        <label class="field">Email<input id="email" type="email" autocomplete="email" required></label>
        <button id="sendBtn" class="submit" type="submit">Send reset code</button>
      </form>
    </section>

    <section id="resetStep" class="hidden">
      <h1>Choose a new password</h1>
      <p id="resetCopy" class="copy">Enter the 6-digit code from your email and your new password.</p>
      <form id="resetForm" class="form">
        <label class="field">Reset code<input id="code" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>
        <label class="field">New password<input id="newPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <label class="field">Confirm new password<input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <button id="resetBtn" class="submit" type="submit">Reset password</button>
      </form>
      <button id="resendBtn" class="link" type="button">Resend code</button>
    </section>

    <button id="backLogin" class="link" type="button">Back to login</button>
    <p id="error" class="error"></p>
    <p id="success" class="success"></p>
  </main>

  <script>
    (function(){
      'use strict';
      const BACKEND='https://flowsignal-backend-3.onrender.com';
      let pendingEmail='';
      let resendTimer=null;
      const emailStep=document.getElementById('emailStep');
      const resetStep=document.getElementById('resetStep');
      const emailForm=document.getElementById('emailForm');
      const resetForm=document.getElementById('resetForm');
      const email=document.getElementById('email');
      const code=document.getElementById('code');
      const newPassword=document.getElementById('newPassword');
      const confirmPassword=document.getElementById('confirmPassword');
      const sendBtn=document.getElementById('sendBtn');
      const resetBtn=document.getElementById('resetBtn');
      const resendBtn=document.getElementById('resendBtn');
      const backLogin=document.getElementById('backLogin');
      const error=document.getElementById('error');
      const success=document.getElementById('success');
      const resetCopy=document.getElementById('resetCopy');

      function detailCode(data){return typeof data?.detail==='string'?data.detail:'REQUEST_FAILED';}
      function friendly(value){return String(value||'Something went wrong').replaceAll('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase());}
      function clearMessages(){error.textContent='';success.textContent='';}
      function startCountdown(seconds=60){
        if(resendTimer)clearInterval(resendTimer);
        let left=Math.max(0,Number(seconds)||60);
        const draw=()=>{resendBtn.textContent=left>0?`Resend code in ${left}s`:'Resend code';resendBtn.disabled=left>0;};
        draw();
        resendTimer=setInterval(()=>{left-=1;draw();if(left<=0){clearInterval(resendTimer);resendTimer=null;}},1000);
      }
      async function requestCode(){
        clearMessages();
        const address=String(email.value||pendingEmail).trim().toLowerCase();
        if(!address){error.textContent='Enter your email.';return;}
        sendBtn.disabled=true;resendBtn.disabled=true;
        try{
          const response=await fetch(`${BACKEND}/auth/forgot-password`,{
            method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:address})
          });
          const data=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(detailCode(data));
          pendingEmail=address;
          emailStep.classList.add('hidden');
          resetStep.classList.remove('hidden');
          resetCopy.textContent=`If ${data.email||address} is registered, a 6-digit reset code was sent.`;
          startCountdown(data.resend_after||60);
          setTimeout(()=>code.focus(),50);
        }catch(err){error.textContent=friendly(err.message||'Could not send reset code');resendBtn.disabled=false;}finally{sendBtn.disabled=false;}
      }

      emailForm.addEventListener('submit',event=>{event.preventDefault();requestCode();});
      resendBtn.addEventListener('click',requestCode);
      code.addEventListener('input',()=>{code.value=code.value.replace(/\D/g,'').slice(0,6);});
      resetForm.addEventListener('submit',async(event)=>{
        event.preventDefault();clearMessages();
        const cleanCode=code.value.replace(/\D/g,'').slice(0,6);
        if(cleanCode.length!==6){error.textContent='Enter the 6-digit code.';return;}
        if(newPassword.value!==confirmPassword.value){error.textContent='Passwords do not match.';return;}
        resetBtn.disabled=true;
        try{
          const response=await fetch(`${BACKEND}/auth/reset-password`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:pendingEmail,code:cleanCode,new_password:newPassword.value})
          });
          const data=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(detailCode(data));
          sessionStorage.removeItem('flowsignal_user_session_token');
          sessionStorage.removeItem('flowsignal_csrf_token');
          success.textContent='Password reset. Opening login…';
          setTimeout(()=>location.replace('/account.html?mode=login&reset=1'),700);
        }catch(err){error.textContent=friendly(err.message||'Password reset failed');}finally{resetBtn.disabled=false;}
      });
      backLogin.addEventListener('click',()=>location.replace('/account.html?mode=login'));
    })();
  </script>
</body>
</html>

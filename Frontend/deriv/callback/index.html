<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connecting Deriv · FlowSignal</title>
  <style>
    html,body{height:100%;margin:0;background:#020812;color:#e9f2ff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}.card{width:min(520px,88vw);padding:28px;border:1px solid #21466e;border-radius:16px;background:#07111f;text-align:center}.muted{color:#91a6bd;font-size:13px}.error{color:#ff7373}
  </style>
</head>
<body>
  <main class="card"><h2>Connecting Deriv…</h2><p id="status" class="muted">Finishing secure account connection.</p></main>
  <script>
    (async function(){
      const status=document.getElementById('status');
      const local=location.hostname==='localhost'||location.hostname==='127.0.0.1';
      const customerBackend=local?'http://127.0.0.1:8001':`${location.origin}/api/proxy`;
      const directBackend=local?'http://127.0.0.1:8001':'https://flowsignal-backend-3.onrender.com';
      const params=new URLSearchParams(location.search);
      const error=params.get('error');
      if(error){status.className='error';status.textContent=error==='access_denied'?'Deriv connection was cancelled. Your existing account connection is unchanged.':'Deriv could not authorize the connection. Return to FlowSignal and try again.';return;}
      const code=params.get('code');
      const returnedState=params.get('state');
      const expectedState=sessionStorage.getItem('flowsignal_deriv_oauth_state');
      const verifier=sessionStorage.getItem('flowsignal_deriv_pkce_verifier');
      const initiatingUser=sessionStorage.getItem('flowsignal_deriv_oauth_user_id');
      if(!code||!returnedState||!expectedState||returnedState!==expectedState||!verifier){
        status.className='error';status.textContent='Deriv OAuth verification failed. Return to FlowSignal and connect again.';return;
      }
      try{
        const customerToken=sessionStorage.getItem('flowsignal_user_session_token')||'';
        const savedCsrf=sessionStorage.getItem('flowsignal_csrf_token')||'';
        const sessionHeaders=customerToken?{'Authorization':`FlowSignalUser ${customerToken}`}:{ };
        const sessionResponse=await fetch(`${customerBackend}/auth/session`,{credentials:'include',cache:'no-store',headers:sessionHeaders});
        const sessionData=await sessionResponse.json().catch(()=>({}));
        let response;
        if(sessionData?.authenticated&&sessionData?.user?.id&&sessionData?.csrf_token){
          if(initiatingUser&&initiatingUser!==sessionData.user.id) throw new Error('Deriv OAuth user mismatch. Return to FlowSignal and reconnect from the correct user account.');
          const headers={'Content-Type':'application/json','Authorization':`FlowSignalUser ${customerToken}`,'X-FlowSignal-CSRF':savedCsrf||sessionData.csrf_token};
          response=await fetch(`${customerBackend}/user/deriv/oauth/exchange`,{method:'POST',credentials:'include',headers,body:JSON.stringify({code,code_verifier:verifier,state:returnedState})});
        }else{
          let legacyUserId=localStorage.getItem('flowsignal_binary_user_id');
          if(!legacyUserId){legacyUserId=crypto.randomUUID();localStorage.setItem('flowsignal_binary_user_id',legacyUserId);}
          const ownerToken=localStorage.getItem('flowsignal_session_token')||'';
          response=await fetch(`${directBackend}/deriv/oauth/exchange`,{method:'POST',headers:{'Content-Type':'application/json',...(ownerToken?{'Authorization':`Bearer ${ownerToken}`}:{})},body:JSON.stringify({code,code_verifier:verifier,user_id:legacyUserId})});
        }
        const payload=await response.json().catch(()=>({}));
        if(!response.ok||!payload.connection_id){const messages={DERIV_OAUTH_STATE_EXPIRED:'The Deriv login window expired. Start again.',DERIV_OAUTH_STATE_REPLAYED:'This Deriv callback was already used.',DERIV_OAUTH_USER_MISMATCH:'This Deriv login belongs to another FlowSignal account.'};throw new Error(messages[payload.detail]||'Deriv connection could not be completed. Return to FlowSignal and try again.');}
        localStorage.setItem('flowsignal_deriv_connection_id',payload.connection_id);
        sessionStorage.removeItem('flowsignal_deriv_oauth_state');
        sessionStorage.removeItem('flowsignal_deriv_pkce_verifier');
        sessionStorage.removeItem('flowsignal_deriv_oauth_user_id');
        status.textContent=payload.selected_account_id?'Deriv account connected. Returning to FlowSignal…':'Deriv connected. Select the account to use for Binary execution.';
        localStorage.setItem('flowsignal_trading_mode','binary');
        setTimeout(()=>location.replace('/app.html?deriv=connected'),700);
      }catch(err){status.className='error';status.textContent=err.message||'Could not connect Deriv.';}
    })();
  </script>
</body>
</html>

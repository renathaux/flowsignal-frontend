<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connecting Deriv · FlowSignal</title>
  <style>
    html,body{height:100%;margin:0;background:#020812;color:#e9f2ff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}.card{width:min(520px,88vw);padding:28px;border:1px solid #21466e;border-radius:16px;background:#07111f;text-align:center}.muted{color:#91a6bd;font-size:13px}.error{color:#ff7373}
  </style>
</head>
<body>
  <main class="card"><h2>Connecting Deriv…</h2><p id="status" class="muted">Finishing secure demo connection.</p></main>
  <script>
    (async function(){
      const status=document.getElementById('status');
      const backend=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8001':'https://flowsignal-backend-3.onrender.com';
      const params=new URLSearchParams(location.search);
      const error=params.get('error');
      if(error){status.className='error';status.textContent=params.get('error_description')||error;return;}
      const code=params.get('code');
      const returnedState=params.get('state');
      const expectedState=sessionStorage.getItem('flowsignal_deriv_oauth_state');
      const verifier=sessionStorage.getItem('flowsignal_deriv_pkce_verifier');
      if(!code||!returnedState||!expectedState||returnedState!==expectedState||!verifier){
        status.className='error';status.textContent='Deriv OAuth verification failed. Return to FlowSignal and connect again.';return;
      }
      try{
        const response=await fetch(`${backend}/deriv/oauth/exchange`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:verifier})});
        const payload=await response.json().catch(()=>({}));
        if(!response.ok||!payload.connection_id)throw new Error(payload.detail||'Deriv connection failed');
        localStorage.setItem('flowsignal_deriv_connection_id',payload.connection_id);
        sessionStorage.removeItem('flowsignal_deriv_oauth_state');
        sessionStorage.removeItem('flowsignal_deriv_pkce_verifier');
        status.textContent=payload.demo_account_verified?'Deriv demo account connected. Returning to FlowSignal…':'Deriv connected. Demo account verification is still required.';
        setTimeout(()=>location.replace('/?deriv=connected'),700);
      }catch(err){status.className='error';status.textContent=err.message||'Could not connect Deriv.';}
    })();
  </script>
</body>
</html>

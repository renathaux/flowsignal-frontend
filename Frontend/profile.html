<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NathauxFX Profile</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020812;color:#eaf3ff;font-family:Inter,Arial,sans-serif}.card{width:min(460px,calc(100vw - 28px));padding:28px;border:1px solid #1c4f7f;border-radius:18px;background:#071522}.muted{color:#93a9c1}.form{display:grid;gap:15px;margin-top:24px}label{display:grid;gap:7px;color:#a9bbce;font-size:12px;font-weight:700}input,button{font:inherit;border-radius:9px;padding:12px}input{border:1px solid #244866;background:#06101c;color:#fff}button{border:0;background:#087df2;color:#fff;font-weight:800;cursor:pointer}.link{display:inline-block;margin-top:18px;color:#69adff}.message{min-height:20px;font-size:12px}.error{color:#ff7474}.success{color:#64d98b}@media(max-width:600px){.card{padding:22px}}</style></head>
<body><main class="card"><h1>Account & security</h1><p id="identity" class="muted">Loading your account…</p><form id="form" class="form"><label>Current password<input id="current" type="password" autocomplete="current-password" minlength="10" required></label><label>New password<input id="next" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="10" required></label><button id="submit" type="submit">Change password</button></form><p id="message" class="message"></p><a class="link" href="/app?user=1">Back to dashboard</a></main>
<script>(async function(){const BACKEND='https://api.nathauxfx.com',token=sessionStorage.getItem('flowsignal_user_session_token')||'',csrf=sessionStorage.getItem('flowsignal_csrf_token')||'',message=document.getElementById('message'),form=document.getElementById('form'),current=document.getElementById('current'),next=document.getElementById('next'),confirm=document.getElementById('confirm'),submit=document.getElementById('submit');const headers={'Authorization':`FlowSignalUser ${token}`};const session=await fetch(`${BACKEND}/auth/session`,{headers,cache:'no-store'}).then(r=>r.json()).catch(()=>({}));if(!session.authenticated){location.replace('/account.html?expired=1');return;}document.getElementById('identity').textContent=session.user.email;form.addEventListener('submit',async e=>{e.preventDefault();message.className='message';message.textContent='';if(next.value!==confirm.value){message.className='message error';message.textContent='New passwords do not match.';return;}submit.disabled=true;const response=await fetch(`${BACKEND}/auth/change-password`,{method:'POST',headers:{...headers,'X-FlowSignal-CSRF':csrf,'Content-Type':'application/json'},body:JSON.stringify({current_password:current.value,new_password:next.value})});const data=await response.json().catch(()=>({}));submit.disabled=false;if(!response.ok){message.className='message error';message.textContent=data.detail==='CURRENT_PASSWORD_INVALID'?'Current password is incorrect.':data.detail==='NEW_PASSWORD_MUST_DIFFER'?'Choose a different new password.':'Password could not be changed. Please try again.';return;}form.reset();message.className='message success';message.textContent='Password changed. Other customer sessions were signed out.';});})();</script></body></html>

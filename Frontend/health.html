<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowSignal Health</title>
  <link rel="stylesheet" href="style.css?v=22" />
</head>
<body class="fit-mode health-page">
  <main class="health-shell">
    <h1>FlowSignal Health</h1>
    <section id="healthStatus" class="health-card">Loading health check...</section>
  </main>
  <script src="apiClient.js?v=1"></script>
  <script>
    const baseUrl = location.hostname === "127.0.0.1" || location.hostname === "localhost"
      ? "http://127.0.0.1:8001"
      : "https://api.flowsignalfx.com";

    fetch(`${baseUrl}/health-check`, { cache: "no-store" })
      .then((response) => response.json())
      .then((data) => {
        document.getElementById("healthStatus").innerHTML = `
          <div><strong>Backend online</strong><span>${data.backend_online ? "Yes" : "No"}</span></div>
          <div><strong>cTrader auth</strong><span>${data.ctrader_auth_status || "--"}</span></div>
          <div><strong>Active account</strong><span>${data.active_account || "--"}</span></div>
          <div><strong>Data source</strong><span>${data.data_source_status || "--"}</span></div>
          <div><strong>Last candle</strong><span>${data.last_candle_time || "--"}</span></div>
          <div><strong>Auto trade</strong><span>Paper: ${data.auto_trade_status?.paper ? "ON" : "OFF"} / Live: ${data.auto_trade_status?.live ? "ON" : "OFF"}</span></div>
        `;
      })
      .catch((error) => {
        document.getElementById("healthStatus").textContent = error.message;
      });
  </script>
</body>
</html>

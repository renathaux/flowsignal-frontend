name: Fix public theme layout

on:
  push:
    paths:
      - .github/workflows/fix-public-theme-layout-once.yml

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent public sections from overlapping
        shell: bash
        run: |
          if ! grep -q "NathauxFX public landing flow fix" Frontend/theme-auto.css; then
            cat >> Frontend/theme-auto.css <<'EOF'

/* NathauxFX public landing flow fix
   The public page contains hero + principles + trust/legal content, so it must
   grow vertically instead of squeezing every section into a fixed 100vh box. */
body:has(#landingPage:not(.hidden)),
body.fit-mode:has(#landingPage:not(.hidden)) {
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

#landingPage.landing-pro {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  max-width: none !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow: visible !important;
}

#landingPage .landing-nav {
  flex: 0 0 auto !important;
  width: 100% !important;
}

#landingPage .hero-section,
#landingPage .hero-stats,
#landingPage .trust-section,
#landingPage .mobile-footer {
  flex-shrink: 0 !important;
}

#landingPage .hero-section {
  position: relative !important;
  width: 100% !important;
  z-index: 1 !important;
}

#landingPage .hero-stats {
  position: relative !important;
  z-index: 2 !important;
  height: auto !important;
  min-height: 110px !important;
  width: min(100%, 980px) !important;
  margin: 12px auto 0 !important;
}

#landingPage .trust-section {
  position: relative !important;
  z-index: 2 !important;
  width: 100% !important;
  max-width: 1180px !important;
  margin: 22px auto 0 !important;
}

#landingPage .mobile-footer {
  position: relative !important;
  z-index: 2 !important;
}

@media (min-width: 701px) {
  #landingPage .hero-section {
    flex: 0 0 auto !important;
    min-height: 590px !important;
  }
}

@media (max-width: 700px) {
  #landingPage.landing-pro {
    height: auto !important;
    min-height: 100vh !important;
    overflow: visible !important;
  }

  #landingPage .hero-section {
    min-height: 0 !important;
  }

  #landingPage .hero-stats {
    min-height: 0 !important;
  }
}
EOF
          fi
          python - <<'PY'
          from pathlib import Path
          for name in ('Frontend/index.html', 'Frontend/home.html'):
              p = Path(name)
              s = p.read_text()
              s = s.replace('theme-auto.css?v=2', 'theme-auto.css?v=3')
              p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/theme-auto.css Frontend/index.html Frontend/home.html
          git rm .github/workflows/fix-public-theme-layout-once.yml
          git commit -m "Fix public light dark layout overlap"
          git push

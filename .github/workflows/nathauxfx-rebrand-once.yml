name: NathauxFX one-time source rebrand

on:
  push:
    paths:
      - .github/workflows/nathauxfx-rebrand-once.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe source-level brand replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Frontend/app.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<title>nathaux.Fx</title>': '<title>NathauxFX</title>',
              'Could not authenticate with the FlowSignal backend': 'Could not authenticate with the NathauxFX backend',
              '<span>FlowSignal</span>': '<span>NathauxFX</span>',
              'FlowSignal provides real-time trading signals, market structure analysis, and smart money insights to help you trade with confidence.': 'NathauxFX provides real-time trading signals, market structure analysis, and smart money insights to help you trade with confidence.',
              'alt="FlowSignal Dashboard"': 'alt="NathauxFX Dashboard"',
              '<h2>FlowSignal Access</h2>': '<h2>NathauxFX Access</h2>',
              'All time visits to FlowSignal': 'All time visits to NathauxFX',
              'Select which account FlowSignal should use for live trading.': 'Select which account NathauxFX should use for live trading.',
              'Remove selected account from FlowSignal': 'Remove selected account from NathauxFX',
              'Remove all saved accounts from FlowSignal': 'Remove all saved accounts from NathauxFX',
              'FlowSignal will place trades on your connected broker account. Continue?': 'NathauxFX will place trades on your connected broker account. Continue?',
              "Welcome to FlowSignal, let's watch the market.": "Welcome to NathauxFX, let's watch the market.",
              'href="https://flowsignalfx.com"': 'href="https://nathauxfx.com"',
              '>\n      flowsignalfx.com\n    </a>': '>\n      nathauxfx.com\n    </a>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nathauxfx-rebrand-once.yml
          git add Frontend/app.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebrand authenticated app to NathauxFX"
          git push

name: NathauxFX visible cleanup

on:
  push:
    paths:
      - .github/workflows/nathauxfx-visible-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean visible legacy branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Frontend/app.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'FlowSignal provides real-time trading signals, market structure analysis,': 'NathauxFX provides real-time trading signals, market structure analysis,',
              '<div class="brand-left"><span class="app-logo-wave" aria-hidden="true">≋</span>FlowSignal</div>': '<div class="brand-left"><span class="app-logo-wave" aria-hidden="true">≋</span>NathauxFX</div>',
              '<div class="header">nathaux.Fx</div>': '<div class="header">NathauxFX</div>',
              '<p id="smartExplainText">FlowSignal is ready.</p>': '<p id="smartExplainText">NathauxFX is ready.</p>',
              'FlowSignal will place trades on your connected broker account.': 'NathauxFX will place trades on your connected broker account.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nathauxfx-visible-cleanup-once.yml
          git add Frontend/app.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove remaining visible FlowSignal branding"
          git push

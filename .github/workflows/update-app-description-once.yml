name: Sync NathauxFX app landing description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-app-description-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update app landing copy and SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Frontend/app.html')
          s = p.read_text()
          old = '''      <p>\n        NathauxFX provides real-time trading signals, market structure analysis,\n        and smart money insights to help you trade with confidence.\n      </p>'''
          new = '''      <p>\n        NathauxFX combines real-time market structure, technical signals, fundamental insights,\n        automated trading, and risk management tools to help traders identify setups, execute trades\n        through cTrader, and receive or share trading signals by email.\n      </p>'''
          s = s.replace(old, new)
          meta = '  <meta name="description" content="NathauxFX is a trading analysis and automated trading platform for EURUSD and Gold, with market structure, technical signals, fundamental insights, risk management, cTrader integration, and email signal sharing.">\n'
          if 'name="description"' not in s:
              s = s.replace('  <title>NathauxFX</title>\n', '  <title>NathauxFX</title>\n' + meta)
          p.write_text(s)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/update-app-description-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/app.html .github/workflows/update-app-description-once.yml
          git commit -m "Sync NathauxFX app landing description" || exit 0
          git push

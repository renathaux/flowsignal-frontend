name: Apply mobile Fx/Bi switch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-fxbi.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch mobile mode switch
        shell: python
        run: |
          from pathlib import Path

          mobile = Path('Frontend/mobile.html')
          text = mobile.read_text()
          old = '<button data-nav="auto"><b>⚙</b><span>Auto Trade</span></button>'
          new = '<button data-nav="fxbi" aria-label="Switch to Binary"><b>⇄</b><span>Fx/Bi</span></button>'
          assert old in text, 'mobile Auto Trade button not found'
          text = text.replace(old, new, 1)
          assert 'mobileNav.js?v=4' in text, 'mobileNav cache version not found'
          text = text.replace('mobileNav.js?v=4', 'mobileNav.js?v=5', 1)
          mobile.write_text(text)

          nav = Path('Frontend/mobileNav.js')
          text = nav.read_text()
          marker = '  const FUND_CACHE_KEY = symbol => `flowsignal_mobile_fund_cache_${symbol}_v1`;\n'
          insert = '''  const MODE_KEY = "flowsignal_trading_mode";\n\n  function tradingMode(){\n    return String(localStorage.getItem(MODE_KEY)||"forex").toLowerCase()==="binary" ? "binary" : "forex";\n  }\n\n  function installMobileModeNavStyle(){\n    if(document.getElementById("mobileFxBiStyle")) return;\n    const style=document.createElement("style");\n    style.id="mobileFxBiStyle";\n    style.textContent=`\n      #flowsignalTradingModeSelector{display:none!important}\n      .bottom-nav.shared-mode-nav{position:fixed!important;left:9px;right:9px;bottom:max(8px,env(safe-area-inset-bottom));height:62px;z-index:3100}\n      body[data-trading-mode="binary"] #flowsignalBinaryMode{padding-bottom:calc(78px + env(safe-area-inset-bottom))}\n      @media(max-height:820px){.bottom-nav.shared-mode-nav{height:52px}}\n    `;\n    document.head.appendChild(style);\n  }\n\n  function ensureSharedModeNav(){\n    const nav=document.querySelector(".bottom-nav");\n    if(!nav) return null;\n    installMobileModeNavStyle();\n    if(nav.parentElement!==document.body) document.body.appendChild(nav);\n    nav.classList.add("shared-mode-nav");\n    return nav;\n  }\n\n  function syncFxBiNav(mode=tradingMode()){\n    const nav=ensureSharedModeNav();\n    if(!nav) return;\n    const fxbi=nav.querySelector('[data-nav="fxbi"]');\n    const home=nav.querySelector('[data-nav="home"]');\n    if(fxbi){\n      fxbi.setAttribute("aria-label",mode==="binary"?"Switch to Forex":"Switch to Binary");\n      fxbi.classList.toggle("active",mode==="binary");\n    }\n    if(mode==="binary") nav.querySelectorAll("button").forEach(button=>{if(button!==fxbi) button.classList.remove("active");});\n    else if(home&&!nav.querySelector('button.active:not([data-nav="fxbi"])')) home.classList.add("active");\n  }\n\n  function fxBiToggle(){\n    closeSheets();\n    const next=tradingMode()==="binary"?"forex":"binary";\n    const switchButton=document.querySelector(`#flowsignalTradingModeSelector [data-trading-mode="${next}"]`);\n    if(switchButton) switchButton.click();\n    else {\n      localStorage.setItem(MODE_KEY,next);\n      document.dispatchEvent(new CustomEvent("flowsignal:trading-mode-changed",{detail:{mode:next}}));\n    }\n    syncFxBiNav(next);\n  }\n'''
          assert marker in text, 'mobileNav insertion marker not found'
          text = text.replace(marker, marker + insert, 1)

          old_auto = '''  function renderAutoTrade(data=cache.panel||{}){\n    const meta=data?._meta||{};\n    const paper=first(meta.paper_auto_enabled,data.paper_auto_enabled,false);\n    const live=first(meta.live_auto_enabled,data.live_auto_enabled,false);\n    const broker=meta.live_account||{};\n    const connected=broker.connected===true;\n    const mode=first(broker.mode,"broker");\n    openDetail("Auto Trade", "AUTO TRADE", `<div class="detail-card desktop-auto-card"><h3>Auto Trade</h3><p class="auto-subtitle">Manage paper and live automated trading.</p>${row("Paper Auto",paper?"ON":"OFF")}${row("Live Auto",live?"ON":"OFF")}${row("Live Broker",connected?"CONNECTED":"DISCONNECTED")}${row("Broker mode",mode)}<p class="auto-readonly">Status only on mobile.</p></div>`);\n  }\n\n  function autoTradeDetail(){\n    activePanel="auto";\n    renderAutoTrade();\n    refreshPanelCache();\n  }\n\n'''
          assert old_auto in text, 'old mobile Auto Trade detail block not found'
          text = text.replace(old_auto, '', 1)
          text = text.replace('    else if(activePanel==="auto") renderAutoTrade();\n', '', 1)
          old_actions = '  const actions={home:closeSheets,isch:ischDetail,fundamental:fundamentalDetail,history:historyDetail,auto:autoTradeDetail};'
          new_actions = '  const actions={home:closeSheets,isch:ischDetail,fundamental:fundamentalDetail,history:historyDetail,fxbi:fxBiToggle};'
          assert old_actions in text, 'old actions map not found'
          text = text.replace(old_actions, new_actions, 1)
          hook = '''\n  document.addEventListener("flowsignal:trading-mode-changed",event=>{\n    syncFxBiNav(event.detail?.mode);\n  });\n  window.addEventListener("load",()=>syncFxBiNav(),{once:true});\n  setTimeout(()=>syncFxBiNav(),0);\n'''
          anchor = '  loadStoredCache();\n'
          assert anchor in text, 'mobileNav loadStoredCache anchor not found'
          text = text.replace(anchor, anchor + hook, 1)
          nav.write_text(text)

          test = Path('Frontend/tests/binary_mode_shell.test.js')
          text = test.read_text()
          marker = "const mobile = fs.readFileSync(path.join(root, 'mobile.html'), 'utf8');\n"
          assert marker in text, 'test mobile marker missing'
          text = text.replace(marker, marker + "const mobileNav = fs.readFileSync(path.join(root, 'mobileNav.js'), 'utf8');\n", 1)
          anchor = "assert.match(mobile, /binary\\/binary-app\\.js\\?v=7/);\n"
          addition = '''assert.match(mobile, /data-nav="fxbi"/, 'mobile Fx\\/Bi button replaces Auto Trade');\nassert.match(mobile, /<span>Fx\\/Bi<\\/span>/);\nassert.doesNotMatch(mobile, /data-nav="auto"/, 'old mobile Auto Trade nav item is removed');\nassert.match(mobile, /mobileNav\\.js\\?v=5/, 'mobile mode-nav cache is bumped');\nassert.match(mobileNav, /fxBiToggle/);\nassert.match(mobileNav, /shared-mode-nav/);\nassert.match(mobileNav, /flowsignal:trading-mode-changed/);\nassert.match(mobileNav, /#flowsignalTradingModeSelector\\{display:none!important\\}/, 'top mode selector is hidden by mobile-only code');\n'''
          assert anchor in text, 'test insertion anchor missing'
          text = text.replace(anchor, anchor + addition, 1)
          test.write_text(text)
      - name: Run mobile/Binary regression test
        run: node Frontend/tests/binary_mode_shell.test.js
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/apply-mobile-fxbi.yml
          git config user.name "FlowSignal Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Frontend/mobile.html Frontend/mobileNav.js Frontend/tests/binary_mode_shell.test.js .github/workflows/apply-mobile-fxbi.yml
          git commit -m "Move mobile Binary switch to Fx/Bi nav"
          git push

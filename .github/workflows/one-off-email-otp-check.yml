name: One-off OTP frontend check

on:
  push:
    branches:
      - codex/email-otp-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract account script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('Frontend/account.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one inline script, found {len(scripts)}')
          Path('/tmp/account.js').write_text(scripts[0])
          required = ['/auth/verify-email', '/auth/resend-verification', 'one-time-code', 'verification_required']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing OTP UI markers: {missing}')
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/account.js

name: Stack broker status and add performance bar setting once

on:
  push:
    paths:
      - '.github/workflows/broker-stack-performance-bar-once.yml'

permissions:
  contents: write

jobs:
  update-dashboard-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply broker stack and performance bar setting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('Frontend/app.html')
          script = Path('Frontend/script.js')
          style = Path('Frontend/style.css')

          app_text = app.read_text()
          script_text = script.read_text()
          style_text = style.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          app_text = replace_once(
              app_text,
              '''    <div class="topbar">\n      <div id="status" class="status status-loading" title="LIVE loading..." data-mobile-label="● LIVE loading...">● LIVE loading...</div>\n      <div id="runtimeStatusDetail" class="runtime-status-detail" data-state="loading">Broker status loading</div>\n\n      <div class="controls">''',
              '''    <div class="topbar">\n      <div class="connection-status-stack">\n        <div id="status" class="status status-loading" title="LIVE loading..." data-mobile-label="● LIVE loading...">● LIVE loading...</div>\n        <div id="runtimeStatusDetail" class="runtime-status-detail" data-state="loading">Broker status loading</div>\n      </div>\n\n      <div class="controls">''',
              'connection status stack',
          )

          app_text = replace_once(
              app_text,
              '        <label><input type="checkbox" data-dashboard-pref="showOpenTradesCounter"> Show Open Trades Counter</label>\n        <label><input type="checkbox" data-dashboard-pref="showTradeLevels"> Show Trade Levels (Entry / SL / TP)</label>',
              '        <label><input type="checkbox" data-dashboard-pref="showOpenTradesCounter"> Show Open Trades Counter</label>\n        <label><input type="checkbox" data-dashboard-pref="showPerformanceBar"> Show Performance Bar (P/L / Open Trades)</label>\n        <label><input type="checkbox" data-dashboard-pref="showTradeLevels"> Show Trade Levels (Entry / SL / TP)</label>',
              'performance bar setting',
          )

          app_text = replace_once(app_text, 'style.css?v=61', 'style.css?v=62', 'style cache bump')
          app_text = replace_once(app_text, 'script.js?v=123', 'script.js?v=124', 'script cache bump')

          script_text = replace_once(
              script_text,
              '  showOpenTradesCounter: true,\n  showTradeLevels: true,',
              '  showOpenTradesCounter: true,\n  showPerformanceBar: true,\n  showTradeLevels: true,',
              'performance bar default',
          )

          script_text = replace_once(
              script_text,
              '  document.body.classList.toggle("hide-open-trades-counter", !prefs.showOpenTradesCounter);\n  document.body.classList.toggle("hide-trade-levels", !prefs.showTradeLevels);',
              '  document.body.classList.toggle("hide-open-trades-counter", !prefs.showOpenTradesCounter);\n  document.body.classList.toggle("hide-performance-bar", !prefs.showPerformanceBar);\n  document.body.classList.toggle("hide-trade-levels", !prefs.showTradeLevels);',
              'performance bar preference application',
          )

          css = '''\n\n/* Dashboard connection stack + optional performance bar */\n.connection-status-stack {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n  min-width: 0;\n}\n\nbody.hide-performance-bar #mainApp > .performance-strip {\n  display: none !important;\n}\n\n@media (min-width: 701px) {\n  body.fit-mode #mainApp.app:not(.locked) > .topbar .connection-status-stack {\n    display: flex !important;\n    flex-direction: column !important;\n    align-items: flex-start !important;\n    gap: 6px !important;\n  }\n}\n'''
          if '/* Dashboard connection stack + optional performance bar */' not in style_text:
              style_text = style_text.rstrip() + css

          app.write_text(app_text)
          script.write_text(script_text)
          style.write_text(style_text)
          PY

      - name: Verify changes
        run: |
          grep -q 'class="connection-status-stack"' Frontend/app.html
          grep -q 'data-dashboard-pref="showPerformanceBar"' Frontend/app.html
          grep -q 'showPerformanceBar: true' Frontend/script.js
          grep -q 'hide-performance-bar' Frontend/script.js
          grep -q 'hide-performance-bar #mainApp > .performance-strip' Frontend/style.css
          grep -q 'style.css?v=62' Frontend/app.html
          grep -q 'script.js?v=124' Frontend/app.html

      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Frontend/app.html Frontend/script.js Frontend/style.css
          git rm .github/workflows/broker-stack-performance-bar-once.yml
          git commit -m 'Stack broker status and add performance bar toggle'
          git push origin main

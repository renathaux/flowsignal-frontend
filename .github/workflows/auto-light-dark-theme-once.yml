name: Add automatic light and dark theme

on:
  push:
    paths:
      - '.github/workflows/auto-light-dark-theme-once.yml'

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add adaptive public-site theme
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Frontend/style.css')
          css = p.read_text()
          marker = '/* NathauxFX automatic device theme */'
          if marker not in css:
              css += r'''

/* NathauxFX automatic device theme */
/* Dark mode remains the existing default. Light mode follows the user's OS/browser preference. */
@media (prefers-color-scheme: light) {
  html {
    color-scheme: light;
  }

  body:has(.landing-page:not(.hidden)) {
    background: #f7f9fc !important;
    color: #0f172a !important;
  }

  .landing-page {
    background:
      radial-gradient(circle at 72% 36%, rgba(37, 99, 235, 0.08), transparent 34%),
      linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%) !important;
    color: #0f172a !important;
  }

  .landing-nav {
    background: rgba(255, 255, 255, 0.82) !important;
    border-bottom-color: rgba(148, 163, 184, 0.22) !important;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .landing-logo,
  .landing-logo span:last-child,
  .hero-left h1 {
    color: #0f172a !important;
  }

  .landing-links a,
  .mobile-footer a,
  .legal-links a {
    color: #2563eb !important;
  }

  .landing-login-btn,
  .hero-secondary,
  #landingLang {
    background: rgba(255, 255, 255, 0.92) !important;
    border-color: #cbd5e1 !important;
    color: #0f172a !important;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05) !important;
  }

  .landing-login-btn:hover,
  .hero-secondary:hover {
    background: #f1f5f9 !important;
    border-color: #94a3b8 !important;
  }

  .landing-get-btn,
  .hero-primary {
    color: #ffffff !important;
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.22) !important;
  }

  .hero-pill {
    background: rgba(239, 246, 255, 0.88) !important;
    border-color: #bfdbfe !important;
    color: #2563eb !important;
  }

  .hero-left h1 span,
  .hero-stats strong {
    color: #2563eb !important;
  }

  .hero-left > p {
    color: #526177 !important;
  }

  .hero-badges {
    color: #334155 !important;
  }

  .hero-dashboard-img {
    border-color: rgba(148, 163, 184, 0.35) !important;
    box-shadow:
      0 28px 70px rgba(15, 23, 42, 0.12),
      0 0 0 1px rgba(255, 255, 255, 0.75) inset !important;
  }

  .hero-stats {
    background: rgba(255, 255, 255, 0.9) !important;
    border-color: #dbe3ee !important;
    box-shadow: 0 18px 46px rgba(15, 23, 42, 0.08) !important;
  }

  .hero-stats span,
  .trusted-text {
    color: #64748b !important;
  }

  .trust-card {
    background:
      radial-gradient(circle at 100% 0, rgba(37, 99, 235, 0.06), transparent 34%),
      #ffffff !important;
    border-color: #dbe3ee !important;
    box-shadow: 0 18px 46px rgba(15, 23, 42, 0.07) !important;
  }

  .trust-card h2 {
    color: #0f172a !important;
  }

  .trust-card p,
  .risk-note {
    color: #526177 !important;
  }

  .trust-point {
    background: #f8fafc !important;
    border-color: #e2e8f0 !important;
  }

  .trust-point strong {
    color: #2563eb !important;
  }

  .trust-point span {
    color: #64748b !important;
  }

  .risk-note {
    border-top-color: #e2e8f0 !important;
  }

  .mobile-footer {
    border-top-color: rgba(148, 163, 184, 0.24) !important;
  }
}
'''
              p.write_text(css)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/style.css
          git rm .github/workflows/auto-light-dark-theme-once.yml
          git commit -m "Add automatic light and dark theme"
          git push

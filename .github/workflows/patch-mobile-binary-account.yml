name: Patch mobile Binary account UI
on:
  push:
    paths:
      - '.github/workflows/patch-mobile-binary-account.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Binary mobile account UI safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Frontend/binary/binary-app.js')
          s=p.read_text()

          s=s.replace("const POLL_MS=6000, DEFAULT_STAKE=10, EXPIRY_MINUTES=5;", "const POLL_MS=6000, DEFAULT_STAKE=10, EXPIRY_MINUTES=5;\n  const DERIV_PUBLIC_WS='wss://api.derivws.com/trading/v1/options/ws/public';", 1)
          old="let mounted=false, pollTimer=null, executionBusy=false, lastLocalSignalId='', selectedAccount=null;"
          new="let mounted=false, pollTimer=null, executionBusy=false, lastLocalSignalId='', selectedAccount=null;\n  let liveQuoteSocket=null, liveQuoteReconnectTimer=null, liveQuoteValue=null, liveRunningRecord=null, liveCountdownTimer=null;"
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("link.href='binary/binary.css?v=6'", "link.href='binary/binary.css?v=7'", 1)

          old='''<article class=\"binary-card binary-contract-card\"><div class=\"binary-card-heading\"><div><span class=\"binary-eyebrow\">ACTIVE CONTRACT</span><h2 id=\"binaryContractTitle\">No Active Contract</h2></div><span id=\"binaryContractStatus\" class=\"binary-status-pill neutral\">IDLE</span></div><p id=\"binaryContractEmpty\">When a signal is executed, contract details will appear here.</p><div id=\"binaryContractDetails\" class=\"binary-contract-details hidden\"><div><span>Direction</span><strong id=\"binaryContractDirection\">--</strong></div><div><span>Account</span><strong id=\"binaryContractAccount\">--</strong></div><div><span>Stake</span><strong id=\"binaryContractStake\">--</strong></div><div><span>Contract ID</span><strong id=\"binaryContractId\">--</strong></div><div><span>Broker entry</span><strong id=\"binaryContractEntry\">--</strong></div><div><span>Potential payout</span><strong id=\"binaryContractPayout\">--</strong></div><div><span>Purchase time</span><strong id=\"binaryContractPurchaseAt\">--</strong></div><div><span>Expiry / settlement</span><strong id=\"binaryContractExpiry\">--</strong></div><div><span>Countdown</span><strong id=\"binaryContractCountdown\">--</strong></div></div></article>'''
          new='''<article class=\"binary-card binary-contract-card\"><div class=\"binary-card-heading\"><div><span class=\"binary-eyebrow\">ACTIVE CONTRACT</span><h2 id=\"binaryContractTitle\">No Active Contract</h2></div><span id=\"binaryContractStatus\" class=\"binary-status-pill neutral\">IDLE</span></div><p id=\"binaryContractEmpty\">When a signal is executed, contract details will appear here.</p><div id=\"binaryContractDetails\" class=\"binary-contract-details hidden\"><div><span>Direction</span><strong id=\"binaryContractDirection\">--</strong></div><div><span>Account</span><strong id=\"binaryContractAccount\">--</strong></div><div><span>Stake</span><strong id=\"binaryContractStake\">--</strong></div><div><span>Contract ID</span><strong id=\"binaryContractId\">--</strong></div><div><span>Broker entry</span><strong id=\"binaryContractEntry\">--</strong></div><div><span>Potential payout</span><strong id=\"binaryContractPayout\">--</strong></div><div><span>Purchase time</span><strong id=\"binaryContractPurchaseAt\">--</strong></div><div><span>Expiry / settlement</span><strong id=\"binaryContractExpiry\">--</strong></div><div><span>Countdown</span><strong id=\"binaryContractCountdown\">--</strong></div></div><div id=\"binaryMobileLiveBar\" class=\"binary-mobile-live-bar binary-mobile-only hidden\"><div class=\"binary-live-head\"><div><span class=\"binary-eyebrow\">LIVE CONTRACT</span><strong>EURUSD <b id=\"binaryLiveType\">--</b></strong></div><div class=\"binary-live-countdown\"><strong id=\"binaryLiveCountdown\">--:--</strong><span>Time remaining</span></div></div><div class=\"binary-live-prices\"><span>ENTRY PRICE<strong id=\"binaryLiveEntry\">--</strong></span><span>CURRENT PRICE<strong id=\"binaryLiveCurrent\">--</strong></span><span>STATUS<strong id=\"binaryLiveStatus\">WAITING</strong></span></div><div class=\"binary-live-track-wrap\"><div class=\"binary-live-track\"><span id=\"binaryLiveLeftLabel\" class=\"binary-live-zone left\">LOSS</span><i class=\"binary-live-entry-marker\"></i><i id=\"binaryLiveCurrentMarker\" class=\"binary-live-current-marker\" style=\"left:50%\"></i><span id=\"binaryLiveRightLabel\" class=\"binary-live-zone right\">WIN</span></div><div class=\"binary-live-track-caption\"><span>ENTRY <b id=\"binaryLiveEntryCaption\">--</b></span><span>CURRENT <b id=\"binaryLiveCurrentCaption\">--</b></span></div></div><div class=\"binary-live-footer\"><span>Expires <strong id=\"binaryLiveExpiry\">--</strong></span><strong id=\"binaryLiveDistance\">Waiting for live quote</strong></div></div></article>\n  <article class=\"binary-card binary-mobile-today binary-mobile-only\"><span class=\"binary-eyebrow\">TODAY</span><div class=\"binary-mobile-today-grid\"><span>TRADES<strong id=\"binaryTodayTrades\">0</strong></span><span>WINS<strong id=\"binaryTodayWins\">0</strong></span><span>LOSSES<strong id=\"binaryTodayLosses\">0</strong></span><span>P/L<strong id=\"binaryTodayPL\">$0.00</strong></span></div></article>'''
          if old not in s: raise SystemExit('contract markup anchor not found')
          s=s.replace(old,new,1)

          old='''function bindBinaryEvents(root){root.querySelector('#binaryDerivConnectBtn')?.addEventListener('click',onConnectClick); root.querySelector('#binaryDerivDisconnectBtn')?.addEventListener('click',onDisconnectClick); root.querySelector('#binaryDerivAccountSelect')?.addEventListener('change',onAccountSelect); root.querySelector('#binarySaveSettings')?.addEventListener('click',saveBinarySettings); root.querySelector('#binaryHistoryRefresh')?.addEventListener('click',refreshHistory); root.querySelector('#binaryAutoToggle')?.addEventListener('change',()=>setText('binaryAutoLabel',document.getElementById('binaryAutoToggle').checked?'ON':'OFF')); root.querySelector('#binaryLogoutBtn')?.addEventListener('click',()=>document.getElementById('logoutBtn')?.click()); root.querySelectorAll('[data-binary-section]').forEach(button=>button.addEventListener('click',()=>{root.querySelectorAll('[data-binary-section]').forEach(item=>item.classList.toggle('active',item===button)); if(button.dataset.binarySection==='accounts') document.getElementById('binaryAccountCard')?.scrollIntoView({behavior:'smooth',block:'start'}); if(button.dataset.binarySection==='history'){refreshHistory(); root.querySelector('.binary-history-card')?.scrollIntoView({behavior:'smooth',block:'start'});} if(button.dataset.binarySection==='settings') location.href='/profile.html';}));}'''
          new='''function setMobileBinarySection(section){const value=['dashboard','accounts','history'].includes(section)?section:'dashboard'; document.body.dataset.binaryMobileSection=value; const root=document.getElementById(BINARY_MODE_ID); root?.querySelectorAll('[data-binary-section]').forEach(item=>item.classList.toggle('active',item.dataset.binarySection===value)); if(value==='accounts') document.getElementById('binaryAccountCard')?.scrollIntoView({behavior:'smooth',block:'start'}); if(value==='history'){refreshHistory(); root?.querySelector('.binary-history-card')?.scrollIntoView({behavior:'smooth',block:'start'});} if(value==='dashboard') root?.querySelector('.binary-signal-card')?.scrollIntoView({behavior:'smooth',block:'start'});}\n  function bindBinaryEvents(root){root.querySelector('#binaryDerivConnectBtn')?.addEventListener('click',onConnectClick); root.querySelector('#binaryDerivDisconnectBtn')?.addEventListener('click',onDisconnectClick); root.querySelector('#binaryDerivAccountSelect')?.addEventListener('change',onAccountSelect); root.querySelector('#binarySaveSettings')?.addEventListener('click',saveBinarySettings); root.querySelector('#binaryHistoryRefresh')?.addEventListener('click',refreshHistory); root.querySelector('#binaryAutoToggle')?.addEventListener('change',()=>setText('binaryAutoLabel',document.getElementById('binaryAutoToggle').checked?'ON':'OFF')); root.querySelector('#binaryLogoutBtn')?.addEventListener('click',()=>document.getElementById('logoutBtn')?.click()); root.querySelectorAll('[data-binary-section]').forEach(button=>button.addEventListener('click',()=>{const section=button.dataset.binarySection; if(section==='settings') return void(location.href='/profile.html'); if(section==='documentation') return; setMobileBinarySection(section);}));}'''
          if old not in s: raise SystemExit('bindBinaryEvents anchor not found')
          s=s.replace(old,new,1)

          old="if(normalized==='binary'){refreshAll(); startPolling();}else stopPolling();"
          new="if(normalized==='binary'){if(!document.body.dataset.binaryMobileSection) document.body.dataset.binaryMobileSection='dashboard'; refreshAll(); startPolling();}else{stopPolling(); stopLiveQuote();}"
          if old not in s: raise SystemExit('applyMode anchor not found')
          s=s.replace(old,new,1)

          anchor='''  function executionValue(data,...keys){for(const key of keys){if(data?.[key]!==undefined&&data?.[key]!==null) return data[key];} return null;}\n'''
          insert='''  function executionValue(data,...keys){for(const key of keys){if(data?.[key]!==undefined&&data?.[key]!==null) return data[key];} return null;}\n  function stopLiveQuote(){if(liveQuoteReconnectTimer){clearTimeout(liveQuoteReconnectTimer); liveQuoteReconnectTimer=null;} if(liveCountdownTimer){clearInterval(liveCountdownTimer); liveCountdownTimer=null;} const socket=liveQuoteSocket; liveQuoteSocket=null; if(socket){try{socket.onclose=null; socket.close();}catch(_error){}} liveQuoteValue=null;}\n  function formatFxPrice(value){const number=Number(value); return Number.isFinite(number)?number.toFixed(5):'--';}\n  function liveExpiryEpoch(record){const value=Number(executionValue(record,'expiry_timestamp','expiry_time')); if(!Number.isFinite(value)||value<=0) return 0; return value>1e12?Math.floor(value/1000):Math.floor(value);}\n  function updateMobileLiveBar(){const bar=document.getElementById('binaryMobileLiveBar'), record=liveRunningRecord; if(!bar||!record){bar?.classList.add('hidden'); return;} bar.classList.remove('hidden'); const entry=Number(executionValue(record,'entry_quote')); const current=Number(liveQuoteValue), type=String(executionValue(record,'contract_type')||(String(record.direction).toUpperCase()==='FALL'?'PUT':'CALL')).toUpperCase(); const expiry=liveExpiryEpoch(record); const remaining=Math.max(0,expiry-Math.floor(Date.now()/1000)); const minutes=Math.floor(remaining/60), seconds=remaining%60; setText('binaryLiveType',type); setText('binaryLiveCountdown',`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`); setText('binaryLiveEntry',formatFxPrice(entry)); setText('binaryLiveEntryCaption',formatFxPrice(entry)); setText('binaryLiveCurrent',formatFxPrice(current)); setText('binaryLiveCurrentCaption',formatFxPrice(current)); setText('binaryLiveExpiry',expiry?new Date(expiry*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'--'); setText('binaryLiveLeftLabel',type==='PUT'?'WIN':'LOSS'); setText('binaryLiveRightLabel',type==='PUT'?'LOSS':'WIN'); const marker=document.getElementById('binaryLiveCurrentMarker'), status=document.getElementById('binaryLiveStatus'), distance=document.getElementById('binaryLiveDistance'); if(!Number.isFinite(entry)||!Number.isFinite(current)){if(status){status.textContent='WAITING'; status.className='';} if(distance) distance.textContent='Waiting for live quote'; if(marker) marker.style.left='50%'; return;} const deltaPips=(current-entry)*10000, winning=Math.abs(deltaPips)<0.005?null:(type==='PUT'?current<entry:current>entry), markerLeft=Math.max(5,Math.min(95,50+deltaPips*3.5)); if(marker) marker.style.left=`${markerLeft}%`; if(status){status.textContent=winning===null?'AT ENTRY':winning?'CURRENTLY WINNING':'CURRENTLY LOSING'; status.className=winning===null?'tie':winning?'winning':'losing';} if(distance){distance.textContent=`${deltaPips>=0?'+':''}${deltaPips.toFixed(1)} pips from entry`; distance.className=winning===null?'tie':winning?'winning':'losing';}}\n  function startLiveQuote(){if(!liveRunningRecord||liveQuoteSocket||typeof WebSocket==='undefined') return; try{const socket=new WebSocket(DERIV_PUBLIC_WS); liveQuoteSocket=socket; socket.onopen=()=>{try{socket.send(JSON.stringify({ticks:'frxEURUSD',subscribe:1,req_id:611}));}catch(_error){}}; socket.onmessage=event=>{try{const payload=JSON.parse(event.data); const quote=Number(payload?.tick?.quote); if(Number.isFinite(quote)){liveQuoteValue=quote; updateMobileLiveBar();}}catch(_error){}}; socket.onerror=()=>{}; socket.onclose=()=>{if(liveQuoteSocket===socket) liveQuoteSocket=null; if(liveRunningRecord&&!liveQuoteReconnectTimer) liveQuoteReconnectTimer=setTimeout(()=>{liveQuoteReconnectTimer=null; startLiveQuote();},3000);}; if(!liveCountdownTimer) liveCountdownTimer=setInterval(updateMobileLiveBar,1000);}catch(_error){liveQuoteSocket=null;}}\n  function updateTodayStats(items){const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(); const today=(items||[]).filter(record=>{const raw=record.settlement_timestamp||record.purchase_timestamp||record.created_at; const n=Number(raw); const ms=Number.isFinite(n)?(n<1e12?n*1000:n):Date.parse(raw); return Number.isFinite(ms)&&ms>=start;}); let wins=0, losses=0, pnl=0; today.forEach(record=>{const result=normalizedResult(record); if(result==='WIN') wins+=1; else if(result==='LOSS') losses+=1; const value=Number(record.profit_loss); if(Number.isFinite(value)) pnl+=value;}); setText('binaryTodayTrades',today.length); setText('binaryTodayWins',wins); setText('binaryTodayLosses',losses); const currency=selectedAccount?.currency||today[0]?.currency||'USD'; setText('binaryTodayPL',formatMoney(pnl,currency)); const pl=document.getElementById('binaryTodayPL'); if(pl){pl.classList.toggle('positive',pnl>0); pl.classList.toggle('negative',pnl<0);}}\n'''
          if anchor not in s: raise SystemExit('executionValue anchor not found')
          s=s.replace(anchor,insert,1)

          old='''function renderExecution(snapshot){const running=snapshot?.running_contract||null, latest=snapshot?.last_execution||null, record=running||latest; if(!record){setText('binaryContractTitle','No Active Contract'); setText('binaryContractStatus','IDLE'); toggleClass('binaryContractDetails','hidden',true); toggleClass('binaryContractEmpty','hidden',false); setText('binarySystemExecution','IDLE'); return;}'''
          new='''function renderExecution(snapshot){const running=snapshot?.running_contract||null, latest=snapshot?.last_execution||null, record=running||latest; liveRunningRecord=running; if(!running){stopLiveQuote(); document.getElementById('binaryMobileLiveBar')?.classList.add('hidden');} if(!record){setText('binaryContractTitle','No Active Contract'); setText('binaryContractStatus','IDLE'); toggleClass('binaryContractDetails','hidden',true); toggleClass('binaryContractEmpty','hidden',false); setText('binarySystemExecution','IDLE'); return;}'''
          if old not in s: raise SystemExit('renderExecution start anchor not found')
          s=s.replace(old,new,1)
          old2="setText('binarySystemExecution',running?'RUNNING':settled?'IDLE':'BLOCKED');}"
          new2="setText('binarySystemExecution',running?'RUNNING':settled?'IDLE':'BLOCKED'); if(running){updateMobileLiveBar(); startLiveQuote();}}"
          if old2 not in s: raise SystemExit('renderExecution end anchor not found')
          s=s.replace(old2,new2,1)

          old3="if(!items.length){rows.innerHTML='<tr><td colspan=\"8\" class=\"binary-empty-row\">No contracts yet</td></tr>'; setText('binaryHistorySummary','No Binary contracts for this account.'); return;}"
          new3="if(!items.length){updateTodayStats([]); rows.innerHTML='<tr><td colspan=\"8\" class=\"binary-empty-row\">No contracts yet</td></tr>'; setText('binaryHistorySummary','No Binary contracts for this account.'); return;} updateTodayStats(items);"
          if old3 not in s: raise SystemExit('history stats anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)

          css=Path('Frontend/binary/binary.css')
          c=css.read_text()
          c += r'''\n/* Mobile Binary account view: the Fx/Bi switch remains in the existing bottom nav. */\n.binary-mobile-only{display:none}\n@media(max-width:700px){\n  body[data-trading-mode="binary"] .flowsignal-mode-selector{display:none!important}\n  .binary-mobile-only{display:block}\n  body[data-trading-mode="binary"] .binary-sidebar{padding-top:10px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-layout{grid-template-columns:1fr 1fr;gap:10px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-signal-card,\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-execution-card,\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-mapping-card,\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-system-card{display:none!important}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] #binaryAccountCard{grid-column:1/3;order:1;min-height:0;padding:18px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-auto-card{grid-column:1;order:2;min-height:138px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-stake-card{grid-column:2;order:3;min-height:138px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-duration-card{grid-column:1/3;order:4;min-height:112px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-contract-card{grid-column:1/3;order:5;min-height:105px}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-mobile-today{grid-column:1/3;order:6}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-history-card{grid-column:1/3;order:7}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-contract-details{display:none!important}\n  body[data-trading-mode="binary"][data-binary-mobile-section="history"] .binary-layout>*:not(.binary-center-column),\n  body[data-trading-mode="binary"][data-binary-mobile-section="history"] .binary-center-column>.binary-signal-card,\n  body[data-trading-mode="binary"][data-binary-mobile-section="history"] .binary-center-column>.binary-contract-card{display:none!important}\n  body[data-trading-mode="binary"][data-binary-mobile-section="history"] .binary-history-card{display:block!important}\n  #binaryAccountCard .binary-card-heading{align-items:center}\n  #binaryAccountCard #binaryDerivAccountSelect{margin-top:16px;padding:12px;border-radius:10px}\n  #binaryAccountCard .binary-account-id{margin-top:8px;font-size:24px}\n  #binaryAccountCard .binary-account-balance{margin:18px 0 2px;font-size:27px}\n  .binary-mobile-today{padding:16px!important}\n  .binary-mobile-today-grid{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}\n  .binary-mobile-today-grid span{display:grid;gap:7px;text-align:center;color:var(--binary-muted);font-size:9px;font-weight:800;border-right:1px solid var(--binary-line)}\n  .binary-mobile-today-grid span:last-child{border-right:0}\n  .binary-mobile-today-grid strong{color:var(--binary-text);font-size:17px}\n  .binary-mobile-today-grid strong.positive{color:var(--binary-green)}\n  .binary-mobile-today-grid strong.negative{color:var(--binary-red)}\n  .binary-mobile-live-bar{margin-top:15px;border-top:1px solid #173554;padding-top:15px}\n  .binary-live-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}\n  .binary-live-head>div:first-child>strong{display:block;margin-top:8px;font-size:22px}\n  .binary-live-head b{margin-left:8px;border:1px solid #14a75b;border-radius:8px;padding:5px 9px;color:var(--binary-green);font-size:12px}\n  .binary-live-countdown{text-align:right}.binary-live-countdown strong{display:block;font-size:24px}.binary-live-countdown span{color:var(--binary-muted);font-size:10px}\n  .binary-live-prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:22px}\n  .binary-live-prices span{color:var(--binary-muted);font-size:9px;font-weight:750}.binary-live-prices strong{display:block;margin-top:6px;color:var(--binary-text);font-size:16px;overflow-wrap:anywhere}\n  #binaryLiveStatus.winning,#binaryLiveDistance.winning{color:var(--binary-green)}#binaryLiveStatus.losing,#binaryLiveDistance.losing{color:var(--binary-red)}#binaryLiveStatus.tie,#binaryLiveDistance.tie{color:var(--binary-amber)}\n  .binary-live-track-wrap{margin-top:22px}.binary-live-track{position:relative;height:8px;margin:0 7px;border-radius:999px;background:linear-gradient(90deg,var(--binary-red),#ffb24d 47%,#d9dd58 53%,var(--binary-green))}\n  .binary-live-track:before,.binary-live-track:after{content:"";position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translateY(-50%)}.binary-live-track:before{left:-5px;background:var(--binary-red)}.binary-live-track:after{right:-5px;background:var(--binary-green)}\n  .binary-live-entry-marker{position:absolute;left:50%;top:50%;width:18px;height:18px;border:3px solid #d7e0eb;background:#73879f;border-radius:50%;transform:translate(-50%,-50%);z-index:2}\n  .binary-live-current-marker{position:absolute;top:50%;width:20px;height:20px;border:3px solid #fff;background:var(--binary-green);border-radius:50%;transform:translate(-50%,-50%);z-index:3;transition:left .25s ease}\n  .binary-live-zone{position:absolute;top:17px;font-size:9px;font-weight:900}.binary-live-zone.left{left:-1px}.binary-live-zone.right{right:-1px}.binary-live-track-caption{display:flex;justify-content:center;gap:50px;margin-top:27px;color:var(--binary-muted);font-size:9px}.binary-live-track-caption b{color:var(--binary-text)}\n  .binary-live-footer{display:flex;justify-content:space-between;gap:10px;margin-top:14px;color:var(--binary-muted);font-size:10px}.binary-live-footer strong{color:var(--binary-text)}\n  body[data-trading-mode="binary"][data-binary-mobile-section="accounts"] .binary-contract-card:has(.binary-mobile-live-bar:not(.hidden))>p{display:none}\n}\n@media(max-width:390px){.binary-live-prices{grid-template-columns:1fr 1fr}.binary-live-prices span:last-child{grid-column:1/3}.binary-mobile-today-grid strong{font-size:15px}}\n'''
          css.write_text(c)

          role=Path('Frontend/tab-role-session.js')
          r=role.read_text()
          if "script.src = 'binary/binary-app.js?v=5';" in r:
              r=r.replace("script.src = 'binary/binary-app.js?v=5';", "script.src = 'binary/binary-app.js?v=6';",1)
          role.write_text(r)
          PY
          node --check Frontend/binary/binary-app.js
          node --check Frontend/tab-role-session.js
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/patch-mobile-binary-account.yml
          git config user.name 'FlowSignal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Frontend/binary/binary-app.js Frontend/binary/binary.css Frontend/tab-role-session.js .github/workflows/patch-mobile-binary-account.yml
          git commit -m 'Build mobile Binary account live contract view [skip mobile binary patch]'
          git push
